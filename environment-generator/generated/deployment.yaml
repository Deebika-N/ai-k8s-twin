apiVersion: v1
kind: Namespace
metadata:
  name: simulation
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulation-paymentservice
  namespace: simulation
spec:
  replicas: 3
  selector:
    matchLabels:
      app: simulation-paymentservice
  template:
    metadata:
      labels:
        app: simulation-paymentservice
    spec:
      containers:
        - name: paymentservice
          image: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/paymentservice:v0.10.6
          env:
            - name: PORT
              value: "50051"
            - name: DISABLE_PROFILER
              value: "1"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          ports:
            - containerPort: 50051
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: simulation-paymentservice
  namespace: simulation
spec:
  selector:
    app: simulation-paymentservice
  ports:
    - port: 50051
      targetPort: 50051
