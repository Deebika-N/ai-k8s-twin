apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulation-paymentservice
  namespace: simulation
spec:
  replicas: 3
  selector:
    matchLabels:
      app: simulation-paymentservice
  template:
    metadata:
      labels:
        app: simulation-paymentservice
    spec:
      containers:
        - name: paymentservice
          image: gcr.io/google-samples/microservices-demo/paymentservice:v0.10.3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          ports:
            - containerPort: 50051
---
apiVersion: v1
kind: Service
metadata:
  name: simulation-paymentservice
  namespace: simulation
spec:
  selector:
    app: simulation-paymentservice
  ports:
    - port: 50051
      targetPort: 50051
