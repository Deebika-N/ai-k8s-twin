apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: payment-cpu-stress
  namespace: simulation
spec:
  mode: one
  selector:
    namespaces:
      - simulation
    labelSelectors:
      app: simulation-paymentservice
  stressors:
    cpu:
      workers: 2
      load: 80
  duration: "2m"

