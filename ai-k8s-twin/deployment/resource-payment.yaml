apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulation-payment
  namespace: simulation-resource
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simulation-payment
  template:
    metadata:
      labels:
        app: simulation-payment
    spec:
      containers:
      - name: payment
        image: nginx:latest
        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "500m"
            memory: "128Mi"
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: simulation-payment
  namespace: simulation-resource
spec:
  selector:
    app: simulation-payment
  ports:
  - port: 80
    targetPort: 80

