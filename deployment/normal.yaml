apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulation-payment
  namespace: simulation-normal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simulation-payment
  template:
    metadata:
      labels:
        app: simulation-payment
    spec:
      containers:
      - name: payment
        image: nginx:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: simulation-payment
  namespace: simulation-normal
spec:
  selector:
    app: simulation-payment
  ports:
  - port: 80
    targetPort: 80
